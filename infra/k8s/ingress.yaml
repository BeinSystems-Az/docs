apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docs
  namespace: erp-prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - docs.beinsystems.az
      secretName: docs-beinsystems-az-tls
  rules:
    - host: docs.beinsystems.az
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: docs
                port:
                  name: http
