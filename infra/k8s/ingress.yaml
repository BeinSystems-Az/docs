apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docs
  namespace: erp-dev
spec:
  ingressClassName: nginx
  rules:
    - host: docs.beinsystems.az
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: docs
                port:
                  name: http
