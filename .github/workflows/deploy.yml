name: Build and publish
run-name: Build / ${{ github.event.head_commit.message || github.sha }}
'on':
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: immutable-release-main
  cancel-in-progress: false
  queue: max
env:
  IMAGE_REPOSITORY: registry.digitalocean.com/bein-erp/erp-docs
  RELEASE_IMAGES: '["registry.digitalocean.com/bein-erp/erp-docs"]'
  BUILD_NUMBER_FLOOR: '25'
  KARGO_PROJECT: docs
jobs:
  build:
    name: Build and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: image-publish
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Set up Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
    - name: Registry CLI
      uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f
      with:
        version: 2.0.0
        token: ${{ secrets.DO_ACCESS_TOKEN }}
    - name: Registry login
      run: doctl registries login bein-erp --expiry-seconds 3600
    - name: Next published build number
      run: python3 .github/scripts/release_build.py identity
    - name: Build and push candidate image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        context: .
        push: true
        provenance: false
        tags: ${{ env.IMAGE }}
        build-args: |-
          APP_REVISION=${{ github.sha }}
          APP_BUILD_NUMBER=${{ env.BUILD_NUMBER }}
          APP_BUILD_ATTEMPT=${{ github.run_attempt }}
          APP_CREATED=${{ env.BUILD_CREATED }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        labels: |-
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.created=${{ env.BUILD_CREATED }}
          az.beinsystems.actions.url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          az.beinsystems.build.number=${{ env.BUILD_NUMBER }}
    - name: Publish immutable build and Freight receipt
      run: python3 .github/scripts/release_build.py publish
    - name: Build identity receipt
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: release-${{ env.BUILD_NUMBER }}-${{ github.run_attempt }}
        path: release-manifest.json
        if-no-files-found: error
    - name: Remove registry credentials
      if: always()
      run: rm -f "$HOME/.docker/config.json"
