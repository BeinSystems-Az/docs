name: Deploy
'on':
  pull_request:
    branches:
    - main
    - master
  push:
    branches:
    - main
permissions:
  contents: read
jobs:
  build:
    name: Build / test / scan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - name: Build identity
      id: identity
      run: "set -euo pipefail\n[[ \"$IMAGE_REPOSITORY\" =~ ^registry.digitalocean.com/bein-erp/[a-z0-9][a-z0-9-]*$ ]]\n[[\
        \ \"$SMOKE_PROFILE\" == http || \"$SMOKE_PROFILE\" == scanner ]]\nBUILD_NUMBER=$((GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET))\n\
        TAG=\"$(printf 'build-%010d-%03d-%s' \"$BUILD_NUMBER\" \"$GITHUB_RUN_ATTEMPT\" \"${GITHUB_SHA:0:12}\")\"\nIMAGE=\"\
        $IMAGE_REPOSITORY:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}\"\nCREATED=\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"\
        \nfor target in \"$GITHUB_ENV\" \"$GITHUB_OUTPUT\"; do\n  if [[ \"$target\" == \"$GITHUB_ENV\" ]]; then\n    printf\
        \ 'IMAGE=%s\\nBUILD_TAG=%s\\nBUILD_CREATED=%s\\nBUILD_NUMBER=%s\\n' \"$IMAGE\" \"$TAG\" \"$CREATED\" \"$BUILD_NUMBER\"\
        \ >> \"$target\"\n  else\n    printf 'image=%s\\ntag=%s\\ncreated=%s\\nnumber=%s\\n' \"$IMAGE\" \"$TAG\" \"$CREATED\"\
        \ \"$BUILD_NUMBER\" >> \"$target\"\n  fi\ndone\n"
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
    - name: Test and build image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        context: .
        load: true
        no-cache-filters: runtime
        push: false
        tags: ${{ env.IMAGE }}
        build-args: 'APP_REVISION=${{ github.sha }}

          APP_BUILD_NUMBER=${{ env.BUILD_NUMBER }}

          APP_BUILD_ATTEMPT=${{ github.run_attempt }}

          APP_CREATED=${{ env.BUILD_CREATED }}'
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Verify documentation pages, assets, redirects and source revision
      run: "set -euo pipefail\ntrap 'docker logs docs-smoke 2>&1 || true; docker rm -f docs-smoke >/dev/null 2>&1 || true'\
        \ EXIT\ndocker run -d --name docs-smoke --read-only --cap-drop=ALL --security-opt=no-new-privileges \\\n --tmpfs /var/cache/nginx:rw,nosuid,size=16m,mode=1777\
        \ --tmpfs /var/run:rw,nosuid,size=8m,mode=1777 \\\n --tmpfs /tmp:rw,nosuid,size=32m,mode=1777 -p 127.0.0.1:18781:8080\
        \ \"$IMAGE\"\npython3 - <<'PYSMOKE'\nimport json,os,re,time,urllib.request,urllib.error\nbase='http://127.0.0.1:18781'\n\
        def get(path):\n with urllib.request.urlopen(base+path,timeout=10) as r:return r.read(),r.headers,r.url\nfor attempt\
        \ in range(30):\n try:\n  payload,headers,_=get('/release.json')\n  assert json.loads(payload)['revision']==os.environ['GITHUB_SHA']\n\
        \  assert 'no-store' in headers.get('Cache-Control','')\n  break\n except Exception:\n  if attempt==29:raise\n  time.sleep(1)\n\
        assert get('/healthz')[0].strip()==b'ok'\nfor path in ['/','/docs/api','/docs/user-guide','/docs/glossary','/docs/faq']:\n\
        \ body,headers,url=get(path)\n assert b'<html' in body and b'BEIN ERP' in body, path\n assert ':8080' not in url and\
        \ '127.0.0.1:18781' in url, url\n for asset in re.findall(r'(?:src|href)=\"([^\" ]+\\.(?:js|css))\"',body.decode()):\n\
        \  if not asset.startswith('/assets/'):continue\n  data,headers,_=get(asset)\n  assert data and 'text/html' not in\
        \ headers.get('Content-Type',''),asset\ntry:get('/assets/missing.js')\nexcept urllib.error.HTTPError as e:assert e.code==404\n\
        else:raise AssertionError('Missing assets must return 404')\nprint('Docs routes, assets, health, relative redirects\
        \ and release revision verified')\nPYSMOKE\n"
    - name: Scan image
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
      with:
        version: v0.76.0
        image-ref: ${{ env.IMAGE }}
        format: json
        output: scan.json
        severity: HIGH,CRITICAL
        exit-code: '0'
    - name: Record runtime and application dependency SBOMs
      run: 'trivy image --format cyclonedx --output runtime-sbom.json "$IMAGE"

        trivy fs --format cyclonedx --output dependency-sbom.json --skip-dirs .git .'
    - name: Enforce image security gate
      run: 'python3 - <<''PYSCAN''

        import json,os

        findings=[v for r in json.load(open(''scan.json'')).get(''Results'',[])for v in r.get(''Vulnerabilities'',[])]

        assert not any(v.get(''FixedVersion'')and v.get(''Severity'')in [''HIGH'',''CRITICAL'']for v in findings),''Fixable
        HIGH/CRITICAL blocks release''

        assert not any(v.get(''Severity'')==''CRITICAL''for v in findings),''CRITICAL blocks production''

        PYSCAN'
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: image-evidence-${{ github.sha }}-${{ github.run_attempt }}
        path: 'scan.json

          runtime-sbom.json

          dependency-sbom.json'
        if-no-files-found: ignore
    - name: Export checked image for publication
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: 'docker save "$IMAGE" -o checked-image.tar

        sha256sum checked-image.tar > checked-image.sha256

        '
    - name: Retain checked image for publication
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: checked-image-${{ github.run_id }}-${{ github.run_attempt }}
        path: 'checked-image.tar

          checked-image.sha256'
        retention-days: 1
        compression-level: 0
        if-no-files-found: error
    outputs:
      image: ${{ steps.identity.outputs.image }}
      tag: ${{ steps.identity.outputs.tag }}
      created: ${{ steps.identity.outputs.created }}
      number: ${{ steps.identity.outputs.number }}
  publish:
    name: Registry publication
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: image-publish
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      BUILD_TAG: ${{ needs.build.outputs.tag }}
      BUILD_CREATED: ${{ needs.build.outputs.created }}
      BUILD_NUMBER: ${{ needs.build.outputs.number }}
    steps:
    - name: Download checked image
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: checked-image-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Load original checked image
      run: 'sha256sum -c checked-image.sha256

        docker load -i checked-image.tar

        '
    - name: Registry login (image publishing only)
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        registry: registry.digitalocean.com
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
    - name: Publish checked immutable release
      id: publish
      run: "set -euo pipefail\ndocker push \"$IMAGE\"\nDIGEST_IMAGE=\"$(docker image inspect \"$IMAGE\" --format '{{index\
        \ .RepoDigests 0}}')\"\n[[ \"$DIGEST_IMAGE\" == \"$IMAGE_REPOSITORY@sha256:\"* ]]\n[[ \"${DIGEST_IMAGE##*@sha256:}\"\
        \ =~ ^[0-9a-f]{64}$ ]]\nexport DIGEST_IMAGE\npython3 - <<'PYMETA'\nimport json, os\nnumber, attempt = int(os.environ['BUILD_NUMBER']),\
        \ int(os.environ['GITHUB_RUN_ATTEMPT'])\nalias = f'build-{number}' + (f'-r{attempt}' if attempt > 1 else '')\nrecord\
        \ = {'build': number, 'attempt': attempt, 'alias': alias, 'revision': os.environ['GITHUB_SHA'],\n          'tag':\
        \ os.environ['BUILD_TAG'], 'image': os.environ['DIGEST_IMAGE'], 'created': os.environ['BUILD_CREATED'],\n        \
        \  'checked_archive_sha256': open('checked-image.sha256').read().split()[0],\n          'run_url': f\"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}\"\
        }\nwith open('release-manifest.json', 'w') as file:\n    json.dump(record, file, indent=2)\nwith open(os.environ['GITHUB_STEP_SUMMARY'],\
        \ 'a') as file:\n    file.write(f\"### {alias}\\n\\nImage: `{record['image']}`\\n\\nSource: `{record['revision']}`\\\
        n\")\nPYMETA\n"
    - name: Release identity evidence
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: release-${{ env.BUILD_NUMBER }}-${{ github.run_attempt }}
        path: release-manifest.json
        if-no-files-found: error
    - name: Publish eligible release tag after evidence upload
      run: "set -euo pipefail\nRELEASE_IMAGE=\"$IMAGE_REPOSITORY:$BUILD_TAG\"\n# Refuse to overwrite a release tag on a rerun/counter\
        \ collision.\nif docker manifest inspect \"$RELEASE_IMAGE\" >/dev/null 2>&1; then\n  echo 'Release tag already exists;\
        \ run identity must not be reused' >&2\n  exit 1\nfi\ndocker tag \"$IMAGE\" \"$RELEASE_IMAGE\"\ndocker push \"$RELEASE_IMAGE\"\
        \n"
    - name: Remove registry credentials
      run: rm -f "$HOME/.docker/config.json"
      if: always()
env:
  BUILD_NUMBER_OFFSET: 0
  IMAGE_REPOSITORY: registry.digitalocean.com/bein-erp/erp-docs
  SMOKE_PROFILE: http
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
